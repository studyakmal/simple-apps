<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pancaran Group - Login</title>

    <!-- External CSS -->
    <link
        rel="stylesheet"
        href="./stylesheet/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Pancaran Logo -->
            <img
                class="logo"
                src="./images/pancaran-logo.png"
                alt="Pancaran Logo"
            >

            <h1>Login Kembali</h1>

            <p>
                Welcome back! Please login to your account.
            </p>

            <form>

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <a
                href="#"
                class="forgot-password"
            >
                Forgot Password?
            </a>

            <div class="footer">

                &copy; 2026 Pancaran Group.
                All rights reserved.

            </div>

        </div>

    </div>

</body>

</html>
